<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dear Love · 위치에 남기는 편지</title>
<meta name="description" content="지금 이 자리에 편지를 두고 가세요. 같은 장소로 돌아왔을 때만 열어볼 수 있어요." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>" />
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">💌</span>
        <div>
          <h1>Dear Love</h1>
          <p class="tagline">이 자리에 두고 간 마음은, 같은 곳에서만 다시 열립니다.</p>
        </div>
      </div>
      <button id="btn-write" class="btn btn-primary">
        <span class="icon">✍️</span> 편지 쓰기
      </button>
    </header>

    <main class="layout">
      <div id="map"></div>

      <aside class="panel" id="panel">
        <div class="panel-header">
          <h2>내가 남긴 편지</h2>
          <span class="count" id="letter-count">0통</span>
        </div>
        <div class="panel-status" id="geo-status">위치 확인 중…</div>
        <ul class="letter-list" id="letter-list"></ul>
        <p class="empty-hint" id="empty-hint">
          아직 남긴 편지가 없어요.<br />
          오른쪽 위 "편지 쓰기" 버튼을 눌러<br />
          지금 이 장소에 첫 편지를 남겨보세요.
        </p>
      </aside>
    </main>
  </div>

  <!-- 편지 쓰기 모달 -->
  <div class="modal-backdrop" id="write-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="write-title">
      <div class="modal-head">
        <h2 id="write-title">✍️ 편지 봉인하기</h2>
        <button class="btn-close" data-close="write-modal" aria-label="닫기">✕</button>
      </div>
      <p class="modal-desc" id="write-location-desc">현재 위치를 확인하고 있어요…</p>
      <label class="field-label" for="letter-title-input">제목 (선택)</label>
      <input id="letter-title-input" type="text" maxlength="40" placeholder="예: 첫 데이트 했던 카페에서" />
      <label class="field-label" for="letter-body-input">편지 내용</label>
      <textarea id="letter-body-input" maxlength="2000" rows="8" placeholder="지금 이 순간, 이 장소에서 전하고 싶은 이야기를 적어보세요…"></textarea>
      <div class="radius-row">
        <label for="radius-select">열람 허용 반경</label>
        <select id="radius-select">
          <option value="30">30m (아주 정확한 자리)</option>
          <option value="100" selected>100m (같은 건물/장소)</option>
          <option value="300">300m (동네 어귀까지)</option>
          <option value="1000">1km (같은 동네)</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="write-modal">취소</button>
        <button class="btn btn-primary" id="btn-seal" disabled>🔒 이 자리에 편지 봉인하기</button>
      </div>
    </div>
  </div>

  <!-- 편지 읽기 / 잠금 모달 -->
  <div class="modal-backdrop" id="read-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="read-title">
      <div class="modal-head">
        <h2 id="read-title">편지</h2>
        <button class="btn-close" data-close="read-modal" aria-label="닫기">✕</button>
      </div>
      <div id="read-body"></div>
      <div class="modal-actions" id="read-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
